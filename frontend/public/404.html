<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora</title>
  <script>
    const path = window.location.pathname.slice(1);
    if (path) {
      sessionStorage.redirect = '/' + path;
    }
    window.location.pathname = '/';
  </script>
</head>
<body></body>
</html>
